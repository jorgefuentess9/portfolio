<section class="container section" id="habilidades" aria-labelledby="habilidades-titulo">
  <div class="section__header">
    <h2 class="section__title" id="habilidades-titulo">
      <span class="prefix">~/</span>{{ state.t().skills.sectionTitle.replace('~/', '') }}
    </h2>
    <p class="section__desc">{{ state.t().skills.sectionSubtitle }}</p>
  </div>

  <div class="skills-grid">
    @for (category of state.t().skills.categories; track category.title) {
      <div class="skill-category-card">
        <p class="skill-kind">stack</p>
        <h3 class="category-title">{{ category.title }}</h3>
        
        <ul class="tags" aria-label="Habilidades de la categoría">
          @for (item of category.skills; track item) {
            <li class="tag-item">{{ item }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
