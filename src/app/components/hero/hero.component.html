<section class="hero-section">
  <div class="container hero-container">
    <div class="hero-badge-wrap">
      <span class="badge badge--accent">
        <span class="pulse-dot"></span>
        {{ state.t().hero.badge }}
      </span>
    </div>

    <h1 class="hero__name">{{ state.t().hero.name }}</h1>
    <p class="hero__subtitle">{{ state.t().hero.subtitle }}</p>

    <p class="hero__intro">
      {{ state.t().hero.intro }}
    </p>

    <div class="hero__links">
      <a class="btn" href="https://github.com/jorgefuentess9" target="_blank" rel="noopener noreferrer">
        {{ state.t().hero.githubBtn }} <span aria-hidden="true">↗</span>
      </a>
      <a class="btn btn--linkedin" href="https://www.linkedin.com/in/jorge-fuentes-aguilar-700838443/" target="_blank" rel="noopener noreferrer">
        <svg class="linkedin-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
        </svg>
        LinkedIn <span aria-hidden="true">↗</span>
      </a>
      <a class="btn btn--primary" href="#contacto">
        {{ state.t().hero.contactBtn }} <span aria-hidden="true">↓</span>
      </a>
    </div>
  </div>
</section>
