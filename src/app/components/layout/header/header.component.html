<header class="site-header">
  <div class="container header-inner">
    <a href="#" class="brand">
      <span class="prompt-symbol">~/</span>jorge-fuentes<span class="cursor">_</span>
    </a>

    <nav class="nav-links" aria-label="Navegación principal">
      <a href="#proyectos" class="nav-link">{{ 'nav.projects' | translate }}</a>
      <a href="#habilidades" class="nav-link">{{ 'nav.skills' | translate }}</a>
      <a href="#formacion" class="nav-link">{{ 'nav.education' | translate }}</a>
      <a href="#contacto" class="nav-link">{{ 'nav.contact' | translate }}</a>
    </nav>

    <div class="header-actions">
      <!-- Selector de Idioma (ES / EN) -->
      <button 
        type="button" 
        class="action-btn lang-btn" 
        (click)="state.toggleLanguage()"
        [attr.aria-label]="'nav.langToggle' | translate"
        title="Cambiar idioma / Switch language">
        <span class="lang-tag" [class.active]="state.currentLang() === 'es'">ES</span>
        <span class="lang-divider">/</span>
        <span class="lang-tag" [class.active]="state.currentLang() === 'en'">EN</span>
      </button>

      <!-- Botón Modo Oscuro / Modo Claro -->
      <button 
        type="button" 
        class="action-btn theme-btn" 
        (click)="state.toggleTheme()"
        [attr.aria-label]="'nav.themeToggle' | translate"
        [title]="state.currentTheme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'">
        @if (state.currentTheme() === 'dark') {
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        } @else {
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        }
      </button>
    </div>
  </div>
</header>
