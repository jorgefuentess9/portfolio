<section class="container container--narrow section" id="contacto" aria-labelledby="contacto-titulo">
  <div class="section__header">
    <h2 class="section__title" id="contacto-titulo">
      <span class="prefix">{{ 'contact.sectionPrefix' | translate }}</span>{{ 'contact.sectionTitle' | translate }}
    </h2>
    <p class="section__desc">{{ 'contact.sectionSubtitle' | translate }}</p>
  </div>

  <p class="contact-intro">
    {{ 'contact.introText' | translate }}
  </p>

  <form class="contact-form" action="https://formspree.io/f/xrpekqzq" method="POST">
    <div class="form-group">
      <label for="name" class="form-label">{{ 'contact.formName' | translate }} *</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        class="form-control"
        autocomplete="name"
        [placeholder]="'contact.formNamePlaceholder' | translate" 
        required>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">{{ 'contact.formEmail' | translate }} *</label>
      <input 
        type="email" 
        id="email" 
        name="_replyto" 
        class="form-control"
        autocomplete="email"
        [placeholder]="'contact.formEmailPlaceholder' | translate" 
        required>
    </div>

    <div class="form-group">
      <label for="message" class="form-label">{{ 'contact.formMessage' | translate }} *</label>
      <textarea 
        id="message" 
        name="message" 
        rows="5" 
        class="form-control"
        [placeholder]="'contact.formMessagePlaceholder' | translate" 
        required></textarea>
    </div>

    <button 
      type="submit" 
      class="btn btn--primary submit-btn">
      <span>{{ 'contact.submitBtn' | translate }}</span>
      <span aria-hidden="true">↗</span>
    </button>
  </form>
</section>
